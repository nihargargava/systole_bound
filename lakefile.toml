name = "systolic_growth"
version = "0.1.0"
defaultTargets = ["SystolicGrowth"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0-rc2"

[[lean_lib]]
name = "SystolicGrowth"
roots = [
  "Challenge", "Solution", "main", "MainTheorem", "Core.SystolicCore",
  "Core.Reduction", "CookMagyar.All", "CookMagyar.DecayTemp",
  "SurfaceGroup.Presentation", "SurfaceGroup.Raw", "SurfaceGroup.Standard",
  "SurfaceGroup.Tietze"
]
# Build the source package and all of its local dependencies.
globs = [
  "Challenge", "Solution", "main", "MainTheorem", "Core.+", "SurfaceGroup.+",
  "CookMagyar.+",
  "BuserSarnak.+", "Geometry.+", "Vendored.+"
]
